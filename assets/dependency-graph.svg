    <path d="M 292,200 V 212 Q 292,220 284,220 H 228 Q 220,220 220,228 V 256" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.85" marker-end="url(#arrow-accent)"/>
    <path d="M 348,200 V 228 Q 348,236 356,236 H 412 Q 420,236 420,244 V 256" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.85" marker-end="url(#arrow-accent)"/>
    <path d="M 220,424 V 444 Q 220,452 228,452 H 312 Q 320,452 320,460 V 480" fill="none" stroke="#526176" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
    <path d="M 248,312 V 336 Q 248,344 256,344 H 384 Q 392,344 392,352 V 368" fill="none" stroke="#526176" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
