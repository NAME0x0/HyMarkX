<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 636" width="640" height="636" role="img" aria-labelledby="hmx-deps-title hmx-deps-desc">
  <title id="hmx-deps-title">HyMarkX package dependencies</title>
  <desc id="hmx-deps-desc">Dependency graph of the 7 HyMarkX packages in 5 layers, from ast at the top through parser, compiler and formatter to the hymarkx installer at the bottom. Only the parser package carries Markdown engine dependencies, and it sits inside a boundary marking that rule.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#526176" fill-opacity="0.55"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <rect x="216" y="112" width="208" height="96" rx="8" fill="#2563eb" fill-opacity="0.04" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="228" y="105" width="156" height="14" fill="#f8fafc"/>
  <text x="234" y="116" fill="#2563eb" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.12em">MARKDOWN ENGINE / ADR-0005</text>

  <g>
    <path d="M 192,312 V 368" fill="none" stroke="#526176" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
